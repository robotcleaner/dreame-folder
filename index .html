<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreame FAQ - 多语言智能问答系统</title>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <style>
        :root {
            --primary: #dc2626;
            --primary-light: #fef2f2;
            --primary-dark: #991b1b;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 8px;
            --radius-lg: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--gray-50);
            color: var(--gray-800);
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-lg);
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.875rem;
        }

        /* Language Switcher */
        .lang-switcher {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .lang-btn {
            padding: 0.5rem 1rem;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: white;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .lang-btn.active {
            background: white;
            color: var(--primary);
            border-color: white;
        }

        /* Search Section */
        .search-section {
            background: white;
            padding: 1.5rem 1rem;
            border-bottom: 1px solid var(--gray-200);
            position: sticky;
            top: 140px;
            z-index: 90;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-lg);
            font-size: 1rem;
            transition: all 0.2s;
            background: var(--gray-50);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
        }

        /* Product Filter */
        .filter-section {
            background: white;
            padding: 1rem;
            border-bottom: 1px solid var(--gray-200);
            position: sticky;
            top: 220px;
            z-index: 80;
        }

        .filter-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .filter-title {
            font-size: 0.875rem;
            color: var(--gray-500);
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .filter-tabs {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 0.625rem 1.25rem;
            border: 1px solid var(--gray-200);
            background: white;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--gray-600);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .filter-tab:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .filter-count {
            background: rgba(255,255,255,0.2);
            padding: 0.125rem 0.5rem;
            border-radius: 999px;
            font-size: 0.75rem;
        }

        /* Main Content */
        .main-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
            min-height: calc(100vh - 400px);
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 4rem 2rem;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--gray-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--gray-500);
            font-size: 0.875rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .empty-title {
            font-size: 1.25rem;
            color: var(--gray-700);
            margin-bottom: 0.5rem;
        }

        .empty-desc {
            color: var(--gray-500);
            font-size: 0.875rem;
        }

        /* FAQ Card */
        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .faq-card {
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
            overflow: hidden;
            transition: all 0.2s;
            cursor: pointer;
        }

        .faq-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--gray-300);
        }

        .faq-card.expanded {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .faq-header {
            padding: 1.25rem;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .faq-badge {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            flex-shrink: 0;
        }

        .product-tag {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.625rem;
            border-radius: var(--radius);
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .product-tag.vacuum { background: #dbeafe; color: #1e40af; }
        .product-tag.scrubber { background: #dcfce7; color: #166534; }
        .product-tag.hair { background: #fce7f3; color: #9d174d; }
        .product-tag.cleaner { background: #fef3c7; color: #92400e; }

        .product-model {
            font-size: 0.6875rem;
            color: var(--gray-500);
            padding: 0 0.625rem;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .faq-content {
            flex: 1;
            min-width: 0;
        }

        .faq-question {
            font-weight: 600;
            color: var(--gray-800);
            font-size: 1rem;
            line-height: 1.5;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .faq-icon {
            width: 24px;
            height: 24px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .faq-toggle {
            margin-left: auto;
            color: var(--gray-400);
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .faq-card.expanded .faq-toggle {
            transform: rotate(180deg);
            color: var(--primary);
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .faq-card.expanded .faq-answer {
            max-height: 2000px;
        }

        .faq-answer-inner {
            padding: 0 1.25rem 1.25rem 3.5rem;
            color: var(--gray-600);
            font-size: 0.9375rem;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 2rem;
            padding: 1rem;
        }

        .page-btn {
            padding: 0.5rem 0.875rem;
            border: 1px solid var(--gray-200);
            background: white;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.875rem;
            color: var(--gray-600);
            transition: all 0.2s;
            min-width: 36px;
        }

        .page-btn:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
        }

        .page-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-ellipsis {
            color: var(--gray-400);
            padding: 0.5rem;
        }

        /* Stats */
        .stats-bar {
            background: var(--gray-100);
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            color: var(--gray-600);
        }

        .stats-count {
            font-weight: 600;
            color: var(--primary);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .filter-section {
                top: 200px;
            }

            .search-section {
                top: 120px;
            }

            .faq-header {
                padding: 1rem;
            }

            .faq-answer-inner {
                padding: 0 1rem 1rem 1rem;
            }

            .faq-badge {
                min-width: 80px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Dreame FAQ</h1>
        <p data-i18n="subtitle">智能产品问答系统</p>
        <div class="lang-switcher">
            <button class="lang-btn active" data-lang="cn">中文</button>
            <button class="lang-btn" data-lang="en">English</button>
            <button class="lang-btn" data-lang="jp">日本語</button>
            <button class="lang-btn" data-lang="kr">한국어</button>
        </div>
    </header>

    <section class="search-section">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="searchInput" placeholder="搜索问题或关键词..." data-i18n-placeholder="searchPlaceholder">
        </div>
    </section>

    <section class="filter-section">
        <div class="filter-container">
            <div class="filter-title" data-i18n="filterTitle">产品分类</div>
            <div class="filter-tabs" id="filterTabs">
                <!-- Tabs will be rendered by JS -->
            </div>
        </div>
    </section>

    <main class="main-content">
        <div id="content">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div class="loading-text" data-i18n="loading">正在加载数据...</div>
            </div>
        </div>
    </main>

    <script>
        // Configuration
        const CONFIG = {
            itemsPerPage: 30
        };

        // Internationalization
        const i18n = {
            cn: {
                subtitle: '智能产品问答系统',
                searchPlaceholder: '搜索问题或关键词...',
                filterTitle: '产品分类',
                loading: '正在加载数据...',
                emptyTitle: '暂无相关问题',
                emptyDesc: '请尝试其他关键词或切换产品分类',
                all: '全部',
                products: {
                    '扫地机': '扫地机',
                    '洗地机': '洗地机',
                    '吸尘器': '吸尘器',
                    '吹风机': '吹风机',
                    'Others': '其他'
                }
            },
            en: {
                subtitle: 'Smart Product Q&A System',
                searchPlaceholder: 'Search questions or keywords...',
                filterTitle: 'Product Category',
                loading: 'Loading data...',
                emptyTitle: 'No related questions found',
                emptyDesc: 'Try different keywords or switch product category',
                all: 'All',
                products: {
                    '扫地机': 'Robot Vacuum',
                    '洗地机': 'Floor Scrubber',
                    '吸尘器': 'Vacuum Cleaner',
                    '吹风机': 'Hair Dryer',
                    'Others': 'Others'
                }
            },
            jp: {
                subtitle: 'スマート製品Q&Aシステム',
                searchPlaceholder: '質問やキーワードを検索...',
                filterTitle: '製品カテゴリー',
                loading: 'データを読み込み中...',
                emptyTitle: '関連する質問がありません',
                emptyDesc: '別のキーワードを試すか、製品カテゴリーを切り替えてください',
                all: 'すべて',
                products: {
                    '扫地机': 'ロボット掃除機',
                    '洗地机': '床洗浄機',
                    '吸尘器': '掃除機',
                    '吹风机': 'ヘアドライヤー',
                    'Others': 'その他'
                }
            },
            kr: {
                subtitle: '스마트 제품 Q&A 시스템',
                searchPlaceholder: '질문이나 키워드 검색...',
                filterTitle: '제품 카테고리',
                loading: '데이터 로딩 중...',
                emptyTitle: '관련 질문이 없습니다',
                emptyDesc: '다른 키워드를 시도하거나 제품 카테고리를 변경하세요',
                all: '전체',
                products: {
                    '扫地机': '로봇청소기',
                    '洗地机': '바닥세정기',
                    '吸尘器': '진공청소기',
                    '吹风机': '헤어드라이어',
                    'Others': '기타'
                }
            }
        };

        // Product color mapping
        const productColors = {
            '扫地机': 'vacuum',
            '洗地机': 'scrubber',
            '吹风机': 'hair',
            '吸尘器': 'cleaner',
            'Others': 'vacuum'
        };

        // State
        let currentLang = localStorage.getItem('faqLang') || 'cn';
        let currentFilter = 'all';
        let searchQuery = '';
        let currentPage = 1;
        let allData = [];
        let filteredData = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            setupLanguageSwitcher();
            setupSearch();
            await loadData();
        });

        // Setup language switcher
        function setupLanguageSwitcher() {
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang);
                btn.addEventListener('click', () => {
                    currentLang = btn.dataset.lang;
                    localStorage.setItem('faqLang', currentLang);
                    updateLanguageUI();
                    renderFilters();
                    renderContent();
                });
            });
            updateLanguageUI();
        }

        // Update language UI
        function updateLanguageUI() {
            const texts = i18n[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (texts[key]) el.textContent = texts[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.dataset.i18nPlaceholder;
                if (texts[key]) el.placeholder = texts[key];
            });
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang);
            });
        }

        // Setup search
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            let debounceTimer;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    searchQuery = e.target.value.toLowerCase().trim();
                    currentPage = 1;
                    filterData();
                    renderContent();
                }, 180);
            });
        }

        // Load data
        async function loadData() {
            try {
                const configRes = await fetch('config.json');
                const config = await configRes.json();
                const totalChunks = config.totalChunks || 9;

                const chunks = await Promise.all(
                    Array.from({ length: totalChunks }, async (_, i) => {
                        try {
                            const res = await fetch(`faq_chunk_${i}.json.gz`);
                            const blob = await res.blob();
                            const arrayBuffer = await blob.arrayBuffer();
                            const uint8Array = new Uint8Array(arrayBuffer);
                            const decompressed = pako.inflate(uint8Array, { to: 'string' });
                            return JSON.parse(decompressed);
                        } catch (e) {
                            console.warn(`Failed to load chunk ${i} as gzip, trying json...`);
                            const res = await fetch(`faq_chunk_${i}.json`);
                            return await res.json();
                        }
                    })
                );

                allData = chunks.flat();
                console.log(`Loaded ${allData.length} FAQ items`);
                
                filterData();
                renderFilters();
                renderContent();
            } catch (error) {
                console.error('Failed to load data:', error);
                document.getElementById('content').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-title">加载失败</div>
                        <div class="empty-desc">请刷新页面重试</div>
                    </div>
                `;
            }
        }

        // Filter data
        function filterData() {
            filteredData = allData.filter(item => {
                // Filter by product
                if (currentFilter !== 'all') {
                    const productName = item.product?.cn || item.categories?.[0];
                    if (productName !== currentFilter) return false;
                }

                // Filter by search
                if (searchQuery) {
                    const question = item.question?.[currentLang] || '';
                    const solution = item.solution?.[currentLang] || '';
                    const combined = (question + ' ' + solution).toLowerCase();
                    return combined.includes(searchQuery);
                }

                return true;
            });
        }

        // Render filters
        function renderFilters() {
            const container = document.getElementById('filterTabs');
            const texts = i18n[currentLang];
            
            // Count by product
            const counts = {};
            allData.forEach(item => {
                const product = item.product?.cn || item.categories?.[0] || 'Others';
                counts[product] = (counts[product] || 0) + 1;
            });

            const products = ['扫地机', '洗地机', '吸尘器', '吹风机'];
            const hasOthers = counts['Others'] > 0;

            let html = `
                <button class="filter-tab ${currentFilter === 'all' ? 'active' : ''}" data-filter="all">
                    ${texts.all}
                    <span class="filter-count">${allData.length}</span>
                </button>
            `;

            products.forEach(product => {
                if (counts[product]) {
                    html += `
                        <button class="filter-tab ${currentFilter === product ? 'active' : ''}" data-filter="${product}">
                            ${texts.products[product]}
                            <span class="filter-count">${counts[product]}</span>
                        </button>
                    `;
                }
            });

            if (hasOthers) {
                html += `
                    <button class="filter-tab ${currentFilter === 'Others' ? 'active' : ''}" data-filter="Others">
                        ${texts.products['Others']}
                        <span class="filter-count">${counts['Others']}</span>
                    </button>
                `;
            }

            container.innerHTML = html;

            // Add click handlers
            container.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    currentFilter = tab.dataset.filter;
                    currentPage = 1;
                    filterData();
                    renderFilters();
                    renderContent();
                });
            });
        }

        // Render content
        function renderContent() {
            const container = document.getElementById('content');
            const texts = i18n[currentLang];

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <div class="empty-title">${texts.emptyTitle}</div>
                        <div class="empty-desc">${texts.emptyDesc}</div>
                    </div>
                `;
                return;
            }

            // Pagination
            const totalPages = Math.ceil(filteredData.length / CONFIG.itemsPerPage);
            const start = (currentPage - 1) * CONFIG.itemsPerPage;
            const end = start + CONFIG.itemsPerPage;
            const pageData = filteredData.slice(start, end);

            // Stats
            const statsHtml = `
                <div class="stats-bar">
                    <span>共找到 <span class="stats-count">${filteredData.length}</span> 条问题</span>
                    <span>第 ${currentPage} / ${totalPages} 页</span>
                </div>
            `;

            // FAQ List
            const listHtml = `
                <div class="faq-list">
                    ${pageData.map((item, index) => renderFAQCard(item, start + index)).join('')}
                </div>
            `;

            // Pagination
            const paginationHtml = renderPagination(totalPages);

            container.innerHTML = statsHtml + listHtml + paginationHtml;

            // Add click handlers for FAQ cards
            container.querySelectorAll('.faq-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (e.target.closest('a')) return;
                    card.classList.toggle('expanded');
                });
            });
        }

        // Render FAQ card
        function renderFAQCard(item, index) {
            const productName = item.product?.[currentLang] || item.product?.cn || item.categories?.[0] || 'Others';
            const productCn = item.product?.cn || item.categories?.[0] || 'Others';
            const productModel = item.product_model || '';
            const question = item.question?.[currentLang] || item.question?.cn || '';
            const solution = item.solution?.[currentLang] || item.solution?.cn || '';
            const colorClass = productColors[productCn] || 'vacuum';

            return `
                <div class="faq-card" data-index="${index}">
                    <div class="faq-header">
                        <div class="faq-badge">
                            <span class="product-tag ${colorClass}">${productName}</span>
                            ${productModel ? `<span class="product-model" title="${productModel}">${productModel}</span>` : ''}
                        </div>
                        <div class="faq-content">
                            <div class="faq-question">
                                <span class="faq-icon">Q</span>
                                <span>${escapeHtml(question)}</span>
                            </div>
                        </div>
                        <span class="faq-toggle">▼</span>
                    </div>
                    <div class="faq-answer">
                        <div class="faq-answer-inner">${escapeHtml(solution)}</div>
                    </div>
                </div>
            `;
        }

        // Render pagination
        function renderPagination(totalPages) {
            if (totalPages <= 1) return '';

            let html = '<div class="pagination">';
            
            // Previous
            html += `
                <button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">
                    ←
                </button>
            `;

            // Page numbers
            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);
            
            if (endPage - startPage < maxVisible - 1) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }

            if (startPage > 1) {
                html += `<button class="page-btn" onclick="changePage(1)">1</button>`;
                if (startPage > 2) html += `<span class="page-ellipsis">...</span>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `
                    <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">
                        ${i}
                    </button>
                `;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<span class="page-ellipsis">...</span>`;
                html += `<button class="page-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
            }

            // Next
            html += `
                <button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">
                    →
                </button>
            `;

            html += '</div>';
            return html;
        }

        // Change page
        function changePage(page) {
            currentPage = page;
            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Escape HTML
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
