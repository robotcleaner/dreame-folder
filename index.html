<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreame FAQ - Knowledge Base</title>
    <style>
        :root {
            --red: #C0392B;
            --red-dark: #922B21;
            --bg: #F5F6FA;
            --white: #FFFFFF;
            --gray-100: #F1F3F5;
            --gray-200: #E9ECEF;
            --gray-400: #ADB5BD;
            --gray-600: #6C757D;
            --gray-800: #212529;
            --shadow: 0 2px 12px rgba(0,0,0,0.07);
            --shadow-hover: 0 6px 24px rgba(0,0,0,0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--gray-800);
            min-height: 100vh;
        }

        /* ── Header ── */
        .header {
            background: var(--white);
            border-bottom: 1px solid var(--gray-200);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand img {
            height: 42px;
            width: auto;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--gray-800);
            letter-spacing: -0.3px;
        }

        .brand-title span { color: var(--red); }

        /* ── Language Toggle ── */
        .lang-toggle {
            display: flex;
            gap: 3px;
            background: var(--gray-100);
            border-radius: 8px;
            padding: 4px;
        }

        .lang-btn {
            padding: 5px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-600);
            background: transparent;
            transition: all 0.2s;
        }

        .lang-btn:hover { color: var(--gray-800); background: rgba(255,255,255,0.6); }
        .lang-btn.active { background: var(--white); color: var(--red); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

        /* ── Hero ── */
        .hero {
            background: linear-gradient(135deg, #C0392B 0%, #922B21 100%);
            padding: 48px 24px 60px;
            text-align: center;
        }

        .hero h1 {
            color: white;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .hero p {
            color: rgba(255,255,255,0.82);
            font-size: 15px;
            margin-bottom: 28px;
        }

        .search-wrap {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .search-wrap .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            opacity: 0.5;
        }

        #searchInput {
            width: 100%;
            padding: 14px 16px 14px 48px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.18);
            outline: none;
            transition: box-shadow 0.2s;
        }

        #searchInput:focus { box-shadow: 0 6px 30px rgba(0,0,0,0.25); }

        /* ── Tabs ── */
        .tabs-section {
            background: var(--white);
            border-bottom: 1px solid var(--gray-200);
            position: sticky;
            top: 71px;
            z-index: 90;
        }

        .tabs-wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tabs-wrap::-webkit-scrollbar { display: none; }

        .tabs {
            display: flex;
            gap: 0;
            min-width: max-content;
        }

        .tab {
            padding: 13px 18px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            color: var(--gray-600);
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .tab:hover { color: var(--gray-800); }
        .tab.active { color: var(--red); border-bottom-color: var(--red); }

        .tab .cnt {
            font-size: 11px;
            background: var(--gray-100);
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: 600;
            color: var(--gray-600);
        }

        .tab.active .cnt {
            background: rgba(192,57,43,0.1);
            color: var(--red);
        }

        /* ── Main ── */
        .main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 24px 60px;
        }

        .results-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--gray-600);
            margin-bottom: 16px;
            min-height: 20px;
        }

        .results-bar.hidden { visibility: hidden; }

        /* ── Cards ── */
        .faq-list { display: flex; flex-direction: column; gap: 10px; }

        .card {
            background: var(--white);
            border-radius: 12px;
            border: 1px solid var(--gray-200);
            overflow: hidden;
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
            border-color: rgba(192,57,43,0.25);
        }

        .card-head {
            padding: 16px 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
        }

        .card.open .card-head { border-bottom: 1px solid var(--gray-200); }

        .card-body { flex: 1; min-width: 0; }

        .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }

        .badge {
            font-size: 10px;
            font-weight: 800;
            padding: 2px 9px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .b-robot  { background: #E3F2FD; color: #1565C0; }
        .b-floor  { background: #E8F5E9; color: #2E7D32; }
        .b-hair   { background: #FFF3E0; color: #E65100; }
        .b-wetdry { background: #F3E5F5; color: #7B1FA2; }
        .b-acc    { background: #ECEFF1; color: #455A64; }
        .b-other  { background: #FBE9E7; color: #BF360C; }

        .product-name {
            font-size: 11px;
            color: var(--gray-400);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .question {
            font-size: 15px;
            font-weight: 600;
            color: var(--gray-800);
            line-height: 1.5;
        }

        .chevron {
            font-size: 14px;
            color: var(--gray-400);
            transition: transform 0.25s;
            flex-shrink: 0;
            margin-top: 3px;
        }

        .card.open .chevron { transform: rotate(180deg); }

        .answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
        }

        .card.open .answer { max-height: 1000px; }

        .answer-inner {
            padding: 18px 20px;
            background: var(--gray-100);
        }

        .answer-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--gray-400);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .answer-text {
            font-size: 14px;
            color: var(--gray-800);
            line-height: 1.75;
            white-space: pre-wrap;
        }

        .answer-image {
            margin-top: 12px;
            border-radius: 8px;
            max-width: 100%;
            max-height: 280px;
            width: auto;
            height: auto;
            display: block;
            border: 1px solid var(--gray-200);
            object-fit: cover;
        }

        /* ── Pagination ── */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .pg-btn {
            min-width: 38px;
            height: 38px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            background: var(--white);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-600);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
            transition: all 0.18s;
        }

        .pg-btn:hover { border-color: var(--red); color: var(--red); }
        .pg-btn.active { background: var(--red); border-color: var(--red); color: white; }
        .pg-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        /* ── States ── */
        .loading {
            text-align: center;
            padding: 80px 24px;
            color: var(--gray-400);
            font-size: 15px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid var(--gray-200);
            border-top-color: var(--red);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            margin: 0 auto 14px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty {
            text-align: center;
            padding: 80px 24px;
            color: var(--gray-400);
        }

        .empty .icon { font-size: 44px; margin-bottom: 14px; display: block; }
        .empty p { font-size: 16px; margin-bottom: 5px; }
        .empty small { font-size: 13px; }

        /* ── Footer ── */
        .footer {
            background: var(--gray-800);
            color: rgba(255,255,255,0.5);
            text-align: center;
            padding: 24px;
            font-size: 13px;
        }

        .footer a { color: rgba(255,255,255,0.8); text-decoration: none; }
        .footer a:hover { color: white; }

        .social {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 12px;
        }

        .social a {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .header-inner { padding: 10px 14px; }
            .brand-title { font-size: 16px; }
            .hero { padding: 30px 14px 42px; }
            .hero h1 { font-size: 22px; }
            .main { padding: 16px 14px 40px; }
            .tabs-section { top: 65px; }
            .card-head { padding: 13px 14px; }
            .answer-inner { padding: 14px; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a class="brand" href="#">
            <img src="company_logo.png" alt="Dreame" onerror="this.style.display='none'">
            <div class="brand-title">Dreame <span>FAQ</span></div>
        </a>
        <div class="lang-toggle" id="langToggle">
            <button class="lang-btn active" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="cn">中文</button>
            <button class="lang-btn" data-lang="kr">한국어</button>
            <button class="lang-btn" data-lang="jp">日本語</button>
        </div>
    </div>
</header>

<section class="hero">
    <h1 id="heroTitle">How can we help you?</h1>
    <p id="heroSubtitle">Search across all Dreame products knowledge base</p>
    <div class="search-wrap">
        <span class="icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search questions..." autocomplete="off" spellcheck="false">
    </div>
</section>

<div class="tabs-section">
    <div class="tabs-wrap">
        <div class="tabs" id="tabs"></div>
    </div>
</div>

<main class="main">
    <div class="results-bar hidden" id="resultsBar">
        <span id="resultsCount"></span>
    </div>
    <div id="container">
        <div class="loading" id="loadingState">
            <div class="spinner"></div>
            <span id="loadingText">Loading knowledge base...</span>
        </div>
    </div>
    <div class="pagination" id="pagination"></div>
</main>

<footer class="footer">
    <div class="social">
        <a href="https://www.facebook.com/groups/603829595929077" target="_blank" rel="noopener">🌐 Facebook</a>
        <a href="https://www.youtube.com/@dreametech-robot" target="_blank" rel="noopener">▶ YouTube</a>
    </div>
    <p>© 2026 Dreame Technology. All rights reserved.</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script>
(function () {
    'use strict';

    // ── i18n ──────────────────────────────────────────────────────────────
    var I18N = {
        en: {

        cn: {

            results: '条结果',

            noResultsHint: '请尝试其他关键词或浏览分类',
            loading: '正在加载知识库...',
            allTab: '全部',
            labels: {
                'Robot Vacuum': '扫地机',
                'Floor Washer': '洗地机',
                'Hair Dryer': '吹风机',
                'Wet/Dry Vacuum': '干湿吸尘器',
                'Accessories': '配件',
                'Others': '其他'
            },
            b: {
                'Robot Vacuum': 'b-robot',
                'Floor Washer': 'b-floor',
                'Hair Dryer': 'b-hair',
                'Wet/Dry Vacuum': 'b-wetdry',
                'Accessories': 'b-acc',
                'Others': 'b-other'
            }
        },
        kr: {
            heroTitle: '어떻게 도와드릴까요?',
            heroSubtitle: 'Dreame 전 제품 지식 베이스 검색',
            searchPlaceholder: '질문 검색...',
            results: '개 결과',
            noResults: '검색 결과 없음',
            noResultsHint: '다른 키워드를 시도하거나 카테고리를 탐색하세요',
            loading: '지식 베이스 로딩 중...',
            allTab: '전체',
            labels: {
                'Robot Vacuum': '로봇청소기',
                'Floor Washer': '펄프워셔',
                'Hair Dryer': '헤어드라이기',
                'Wet/Dry Vacuum': '건조청소기',
                'Accessories': '액세서리',
                'Others': '기타'
            },
            b: {
                'Robot Vacuum': 'b-robot',
                'Floor Washer': 'b-floor',
                'Hair Dryer': 'b-hair',
                'Wet/Dry Vacuum': 'b-wetdry',
                'Accessories': 'b-acc',
                'Others': 'b-other'
            }
        },
        jp: {
            heroTitle: 'いかがお手伝いできますか？',
            heroSubtitle: 'Dreame全製品のナレッジベースを検索',
            searchPlaceholder: '質問を検索...',
            results: '件の結果',
            noResults: '結果が見つかりません',
            noResultsHint: '別のキーワードを試すか、カテゴリを参照してください',
            loading: 'ナレッジベースを読み込み中...',
            allTab: 'すべて',
            labels: {
                'Robot Vacuum': 'ロボット掃除機',
                'Floor Washer': '床洗浄機',
                'Hair Dryer': 'ヘアードライヤー',
                'Wet/Dry Vacuum': '乾湿クリーナー',
                'Accessories': 'アクセサリー',
                'Others': 'その他'
            },
            b: {
                'Robot Vacuum': 'b-robot',
                'Floor Washer': 'b-floor',
                'Hair Dryer': 'b-hair',
                'Wet/Dry Vacuum': 'b-wetdry',
                'Accessories': 'b-acc',
                'Others': 'b-other'
            }
        }
    };

    var PAGE_SIZE = 30;
    var TOTAL_CHUNKS = 10;
    var faqData = [];
    var filtered = [];
    var currentPage = 1;
    var currentLang = localStorage.getItem('dfaq-lang') || 'en';
    var currentCat = 'All';
    var isDataLoaded = false;

    // ── gzip-fetch helper ─────────────────────────────────────────────────
    function gzFetch(url) {
        return fetch(url)
            .then(function (r) {
                if (!r.ok) throw new Error('Network response was not ok: ' + r.status);
                return r.arrayBuffer();
            })
            .then(function (buf) {
                if (typeof pako === 'undefined') {
                    throw new Error('pako library not loaded');
                }
                var text = pako.ungzip(new Uint8Array(buf), { to: 'string' });
                return JSON.parse(text);
            });
    }

    // ── fetch with fallback ───────────────────────────────────────────────
    function fetchChunk(i) {
        var gzUrl = 'faq_chunk_' + i + '.json.gz';
        var jsonUrl = 'faq_chunk_' + i + '.json';
        
        return gzFetch(gzUrl).catch(function(err) {
            console.log('Gzip load failed for chunk ' + i + ', trying JSON:', err.message);
            return fetch(jsonUrl)
                .then(function(r) {
                    if (!r.ok) throw new Error('JSON fallback failed: ' + r.status);
                    return r.json();
                });
        });
    }

    // ── init ───────────────────────────────────────────────────────────────
    function init() {
        // Set initial language UI
        document.querySelectorAll('.lang-btn').forEach(function (btn) {
            btn.classList.toggle('active', btn.dataset.lang === currentLang);
        });
        applyI18n();

        // Language toggle event
        document.getElementById('langToggle').addEventListener('click', function (e) {
            var btn = e.target.closest('.lang-btn');
            if (!btn) return;
            
            var newLang = btn.dataset.lang;
            if (newLang === currentLang) return;
            
            currentLang = newLang;
            localStorage.setItem('dfaq-lang', currentLang);
            
            document.querySelectorAll('.lang-btn').forEach(function (b) {
                b.classList.toggle('active', b.dataset.lang === currentLang);
            });
            
            applyI18n();
            rebuildTabs();
            
            if (isDataLoaded) {
                render();
            }
        });

        // Search input event
        document.getElementById('searchInput').addEventListener('input', debounce(function() {
            filter();
        }, 180));

        // Load all data chunks
        loadAllChunks()
            .then(function (data) {
                faqData = data;
                isDataLoaded = true;
                
                var loadingEl = document.getElementById('loadingState');
                if (loadingEl) loadingEl.style.display = 'none';
                
                buildTabs();
                filter();
            })
            .catch(function (err) {
                console.error('Failed to load FAQ data:', err);
                var loadingEl = document.getElementById('loadingState');
                if (loadingEl) loadingEl.style.display = 'none';
                
                document.getElementById('container').innerHTML =
                    '<div class="empty"><span class="icon">⚠️</span><p>Failed to load FAQ data.</p><small>' + 
                    escHtml(err.message || 'Please check your network connection and refresh.') + 
                    '</small></div>';
            });
    }

    function loadAllChunks() {
        var chunks = [];
        for (var i = 0; i < TOTAL_CHUNKS; i++) {
            chunks.push(fetchChunk(i));
        }
        return Promise.all(chunks).then(function (results) {
            var allData = [];
            results.forEach(function(r) {
                if (Array.isArray(r)) {
                    allData = allData.concat(r);
                }
            });
            return allData;
        });
    }

    // ── i18n ──────────────────────────────────────────────────────────────
    function applyI18n() {
        var t = I18N[currentLang];
        document.getElementById('heroTitle').textContent = t.heroTitle;
        document.getElementById('heroSubtitle').textContent = t.heroSubtitle;
        document.getElementById('searchInput').placeholder = t.searchPlaceholder;
        
        var loadingTextEl = document.getElementById('loadingText');
        if (loadingTextEl) {
            loadingTextEl.textContent = t.loading;
        }
    }

    // ── Tabs ───────────────────────────────────────────────────────────────
    function buildTabs() {
        var counts = {};
        faqData.forEach(function (item) {
            item.categories.forEach(function (c) { 
                counts[c] = (counts[c] || 0) + 1; 
            });
        });

        var order = ['All', 'Robot Vacuum', 'Floor Washer', 'Hair Dryer', 'Wet/Dry Vacuum', 'Accessories', 'Others'];
        var cats = order.filter(function (c) { return c === 'All' || counts[c]; });
        if (cats.length === 1) {
            Object.keys(counts).forEach(function (c) { 
                if (!cats.includes(c)) cats.push(c); 
            });
        }

        renderTabs(cats, counts);
    }

    function rebuildTabs() {
        if (!isDataLoaded) return;
        buildTabs();
    }

    function renderTabs(cats, counts) {
        var t = I18N[currentLang];
        var el = document.getElementById('tabs');
        el.innerHTML = '';
        
        cats.forEach(function (cat) {
            var btn = document.createElement('button');
            btn.className = 'tab' + (cat === currentCat ? ' active' : '');
            var label = cat === 'All' ? t.allTab : (t.labels[cat] || cat);
            var count = cat === 'All' ? faqData.length : (counts[cat] || 0);
            btn.innerHTML = label + ' <span class="cnt">' + count + '</span>';
            btn.dataset.cat = cat;
            btn.addEventListener('click', function () {
                currentCat = cat;
                currentPage = 1;
                document.querySelectorAll('.tab').forEach(function (tb) { tb.classList.remove('active'); });
                btn.classList.add('active');
                filter();
            });
            el.appendChild(btn);
        });
    }

    // ── Filter & Render ───────────────────────────────────────────────────
    function filter() {
        if (!isDataLoaded) return;
        
        var query = document.getElementById('searchInput').value.trim().toLowerCase();

        filtered = faqData.filter(function (item) {
            if (currentCat !== 'All' && !item.categories.includes(currentCat)) return false;
            if (!query) return true;
            var texts = [
                item.question.en || '', item.question.cn || '',
                item.question.kr || '', item.question.jp || '',
                item.product || ''
            ].join(' ').toLowerCase();
            return texts.indexOf(query) !== -1;
        });

        currentPage = 1;
        render();
    }

    function render() {
        var t = I18N[currentLang];
        var start = (currentPage - 1) * PAGE_SIZE;
        var pageItems = filtered.slice(start, start + PAGE_SIZE);

        // results bar
        var barEl = document.getElementById('resultsBar');
        var countEl = document.getElementById('resultsCount');
        if (filtered.length !== faqData.length) {
            barEl.classList.remove('hidden');
            countEl.textContent = filtered.length + ' ' + t.results;
        } else {
            barEl.classList.add('hidden');
        }

        // cards
        var container = document.getElementById('container');
        if (filtered.length === 0) {
            container.innerHTML = '<div class="empty"><span class="icon">🔍</span><p>' + t.noResults + '</p><small>' + t.noResultsHint + '</small></div>';
        } else {
            container.innerHTML = '<div class="faq-list" id="faqList"></div>';
            var list = document.getElementById('faqList');
            pageItems.forEach(function (item) { list.appendChild(makeCard(item)); });
        }

        renderPagination();
    }

    function makeCard(item) {
        var t = I18N[currentLang];
        var q = item.question[currentLang] || item.question.en || '';
        var s = item.solution[currentLang] || item.solution.en || '';

        var card = document.createElement('div');
        card.className = 'card';
        card.dataset.id = item.id;

        var badgesHtml = item.categories.map(function (c) {
            var cls = t.b[c] || 'b-other';
            var lbl = t.labels[c] || c;
            return '<span class="badge ' + cls + '">' + lbl + '</span>';
        }).join('');

        var imageHtml = '';
        if (item.image) {
            imageHtml = '<img class="answer-image" src="' + escHtml(item.image) + '" alt="FAQ image" loading="lazy">';
        }

        card.innerHTML =
            '<div class="card-head">' +
                '<div class="card-body">' +
                    '<div class="badges">' + badgesHtml + '</div>' +
                    '<div class="product-name">' + escHtml(item.product) + '</div>' +
                    '<div class="question">' + escHtml(q) + '</div>' +
                '</div>' +
                '<div class="chevron">▼</div>' +
            '</div>' +
            '<div class="answer">' +
                '<div class="answer-inner">' +
                    '<div class="answer-label">' + escHtml(t.solution) + '</div>' +
                    '<div class="answer-text">' + escHtml(s) + '</div>' +
                    imageHtml +
                '</div>' +
            '</div>';

        card.addEventListener('click', function () {
            card.classList.toggle('open');
        });

        return card;
    }

    // ── Pagination ─────────────────────────────────────────────────────────
    function renderPagination() {
        var total = Math.ceil(filtered.length / PAGE_SIZE);
        var el = document.getElementById('pagination');
        el.innerHTML = '';

        if (total <= 1) return;

        function pgBtn(label, page, disabled, active) {
            var b = document.createElement('button');
            b.className = 'pg-btn' + (active ? ' active' : '');
            b.textContent = label;
            b.disabled = disabled;
            b.addEventListener('click', function () {
                currentPage = page;
                render();
                window.scrollTo({ top: 330, behavior: 'smooth' });
            });
            return b;
        }

        el.appendChild(pgBtn('‹', currentPage - 1, currentPage === 1, false));

        var pages = pageNums(currentPage, total);
        pages.forEach(function (p) {
            if (p === '...') {
                var s = document.createElement('span');
                s.style.cssText = 'padding:0 4px;color:var(--gray-400);font-size:13px';
                s.textContent = '...';
                el.appendChild(s);
            } else {
                el.appendChild(pgBtn(p, p, false, p === currentPage));
            }
        });

        el.appendChild(pgBtn('›', currentPage + 1, currentPage === total, false));
    }

    function pageNums(cur, total) {
        if (total <= 7) return range(1, total);
        var pages = [1];
        if (cur > 3) pages.push('...');
        for (var i = Math.max(2, cur - 1); i <= Math.min(total - 1, cur + 1); i++) pages.push(i);
        if (cur < total - 2) pages.push('...');
        pages.push(total);
        return pages;
    }

    function range(start, end) {
        var out = [];
        for (var i = start; i <= end; i++) out.push(i);
        return out;
    }

    // ── Utils ──────────────────────────────────────────────────────────────
    function debounce(fn, delay) {
        var t;
        return function () {
            var args = arguments;
            clearTimeout(t);
            t = setTimeout(function () { fn.apply(null, args); }, delay);
        };
    }

    function escHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // Start initialization
    init();
}());
</script>
