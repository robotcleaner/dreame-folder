<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreame FAQ</title>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <style>
        :root { --primary: #dc2626; --gray-50: #f9fafb; --gray-200: #e5e7eb; --gray-500: #6b7280; --gray-700: #374151; --gray-900: #111827; --radius: 8px; --shadow: 0 1px 3px 0 rgba(0,0,0,0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: var(--gray-50); color: var(--gray-900); line-height: 1.6; }
        .header { background: white; color: var(--gray-900); padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1.25rem; border-bottom: 1px solid var(--gray-200); }
        .header-logo { height: 28px; width: auto; flex-shrink: 0; }
        .header-text { flex: 1; }
        .header-text h1 { font-size: 1.25rem; font-weight: 700; color: var(--gray-900); }
        .header-text p { font-size: 0.8rem; color: var(--gray-500); }
        .container { max-width: 960px; margin: 0 auto; padding: 1rem; }
        .controls { background: white; border-radius: var(--radius); padding: 1rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
        .lang-selector { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .lang-btn { padding: 0.5rem 1rem; border: 1px solid var(--gray-200); background: white; border-radius: var(--radius); cursor: pointer; font-size: 0.875rem; }
        .lang-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .search-box { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--gray-200); border-radius: var(--radius); font-size: 0.95rem; }
        .product-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .product-tab { padding: 0.5rem 0.875rem; border: 1px solid var(--gray-200); background: white; border-radius: 20px; cursor: pointer; font-size: 0.8rem; }
        .product-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
        .stats { background: white; padding: 0.75rem 1rem; border-radius: var(--radius); margin-bottom: 1rem; font-size: 0.875rem; color: var(--gray-500); }
        .faq-card { background: white; border-radius: var(--radius); margin-bottom: 0.75rem; box-shadow: var(--shadow); overflow: hidden; cursor: pointer; }
        .faq-header { padding: 1rem; display: flex; align-items: flex-start; gap: 0.75rem; }
        .faq-badge { display: flex; flex-direction: column; gap: 0.25rem; width: 160px; min-width: 160px; max-width: 160px; }
        .product-tag { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-align: center; background: #e5e7eb; color: #374151; white-space: nowrap; }
        .product-tag.vacuum { background: #dbeafe; color: #1d4ed8; }
        .product-tag.scrubber { background: #dcfce7; color: #15803d; }
        .product-tag.cleaner { background: #fef3c7; color: #b45309; }
        .product-tag.dryer { background: #fce7f3; color: #be185d; }
        .product-tag.pool { background: #e0f2fe; color: #0369a1; }
        .product-model { font-size: 0.7rem; color: var(--gray-500); text-align: left; word-break: break-word; overflow-wrap: break-word; line-height: 1.4; max-height: 120px; overflow-y: auto; }
        .faq-content { flex: 1; }
        .faq-question { font-weight: 600; color: var(--gray-900); display: flex; align-items: flex-start; gap: 0.5rem; }
        .faq-icon { background: var(--primary); color: white; width: 20px; height: 20px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; }
        .faq-icon-a { background: #16a34a; }
        .faq-toggle { color: var(--gray-500); font-size: 0.75rem; transition: transform 0.2s; }
        .faq-card.expanded .faq-toggle { transform: rotate(180deg); }
        .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: var(--gray-50); }
        .faq-card.expanded .faq-answer { max-height: 2000px; }
        .faq-answer-inner { padding: 1rem; padding-left: calc(160px + 1rem); color: var(--gray-700); font-size: 0.95rem; }
        .loading { text-align: center; padding: 3rem; color: var(--gray-500); }
        .translation-note { font-size: 0.75rem; color: var(--gray-500); font-style: italic; margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px dashed var(--gray-200); }
        .pagination { display: flex; justify-content: center; gap: 0.25rem; margin-top: 1.5rem; flex-wrap: wrap; }
        .page-btn { padding: 0.5rem 0.75rem; border: 1px solid var(--gray-200); background: white; border-radius: var(--radius); cursor: pointer; }
        .page-btn.active { background: var(--primary); color: white; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        @media (max-width: 600px) { .faq-header { flex-direction: column; } .faq-badge { flex-direction: row; width: auto; min-width: auto; max-width: none; } .faq-answer-inner { padding-left: 1rem; } .faq-question { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="header">
        <img class="header-logo" src="company_logo.png" alt="Dreame Logo">
        <div class="header-text">
            <h1>FAQ 智能问答</h1>
            <p>全球多语言售后知识库 · <span id="total-count">加载中...</span></p>
        </div>
    </div>
    <div class="container">
        <div class="controls">
            <div class="lang-selector">
                <button class="lang-btn active" data-lang="cn">中文</button>
                <button class="lang-btn" data-lang="en">English</button>
                <button class="lang-btn" data-lang="jp">日本語</button>
                <button class="lang-btn" data-lang="kr">한국어</button>
            </div>
            <input type="text" class="search-box" id="search-box" placeholder="搜索问题或答案...">
        </div>
        <div class="product-tabs" id="product-tabs"></div>
        <div class="stats" id="stats"></div>
        <div id="content"><div class="loading">📦 正在加载 FAQ 数据...</div></div>
    </div>

    <script>
        const CONFIG_URL = 'config.json';
        const CHUNK_PREFIX = 'faq_chunk_';
        const ITEMS_PER_PAGE = 30;

        let allData = [];
        let currentLang = 'cn';
        let currentProduct = 'all';
        let currentPage = 1;
        let searchQuery = '';

        const productLabels = {
            cn: { all: '全部', vacuum: '扫地机', scrubber: '洗地机', cleaner: '吸尘器', dryer: '吹风机', pool: '泳池机器人' },
            en: { all: 'All', vacuum: 'Robot Vacuum', scrubber: 'Floor Scrubber', cleaner: 'Vacuum Cleaner', dryer: 'Hair Dryer', pool: 'Pool Robot' },
            jp: { all: 'すべて', vacuum: 'ロボット掃除機', scrubber: '床洗浄機', cleaner: '掃除機', dryer: 'ヘアドライヤー', pool: 'プールロボット' },
            kr: { all: '전체', vacuum: '로봇청소기', scrubber: '바닥세정기', cleaner: '진공청소기', dryer: '헤어드라이어', pool: '수영장 로봇' }
        };

        const productColors = {
            '扫地机': 'vacuum', 'Robot Vacuum': 'vacuum', 'ロボット掃除機': 'vacuum', '로봇청소기': 'vacuum',
            '洗地机': 'scrubber', 'Floor Scrubber': 'scrubber', '床洗浄機': 'scrubber', '바닥세정기': 'scrubber',
            '吸尘器': 'cleaner', 'Vacuum Cleaner': 'cleaner', '掃除機': 'cleaner', '진공청소기': 'cleaner',
            '吹风机': 'dryer', 'Hair Dryer': 'dryer', 'ヘアドライヤー': 'dryer', '헤어드라이어': 'dryer',
            '泳池机器人': 'pool', 'Pool Robot': 'pool', 'プールロボット': 'pool', '수영장 로봇': 'pool'
        };

        // 获取产品名称（自动翻译为当前语言）
        function getProductName(productCN, lang) {
            const map = {
                'cn': { '扫地机': '扫地机', '洗地机': '洗地机', '吸尘器': '吸尘器', '吹风机': '吹风机', '泳池机器人': '泳池机器人' },
                'en': { '扫地机': 'Robot Vacuum', '洗地机': 'Floor Scrubber', '吸尘器': 'Vacuum Cleaner', '吹风机': 'Hair Dryer', '泳池机器人': 'Pool Robot' },
                'jp': { '扫地机': 'ロボット掃除機', '洗地机': '床洗浄機', '吸尘器': '掃除機', '吹风机': 'ヘアドライヤー', '泳池机器人': 'プールロボット' },
                'kr': { '扫地机': '로봇청소기', '洗地机': '바닥세정기', '吸尘器': '진공청소기', '吹风机': '헤어드라이어', '泳池机器人': '수영장 로봇' }
            };
            return (map[lang] && map[lang][productCN]) ? map[lang][productCN] : productCN;
        }

        // 获取问题文本
        function getQuestion(item, lang) {
            return item.question[lang] || item.question.cn || '';
        }

        // 获取答案文本（如果当前语言没有答案，回退到中文）
        function getAnswer(item, lang) {
            const answer = item.solution[lang];
            // 如果当前语言有有效答案，直接返回
            if (answer && answer.trim()) {
                return answer;
            }
            // 否则回退到中文
            return item.solution.cn || '';
        }

        // 检查是否需要显示翻译提示
        function needsTranslationNote(item, lang) {
            if (lang === 'cn') return false;
            const answer = item.solution[lang];
            // 如果当前语言没有答案，显示提示
            return !answer || !answer.trim();
        }

        async function init() {
            try {
                await loadAllData();
                renderProductTabs();
                renderContent();
                document.getElementById('total-count').textContent = allData.length + ' 条 FAQ';
            } catch (error) {
                console.error(error);
                document.getElementById('content').innerHTML = '<div class="loading">加载失败: ' + error.message + '</div>';
            }
        }

        async function loadAllData() {
            const config = await fetch(CONFIG_URL).then(r => r.json());
            const totalChunks = config.totalChunks;

            const chunks = await Promise.all(
                Array.from({length: totalChunks}, (_, i) => loadChunk(i))
            );

            allData = chunks.flat();
        }

        async function loadChunk(index) {
            const response = await fetch(`${CHUNK_PREFIX}${index}.json.gz?v=20240609`);
            const buffer = await response.arrayBuffer();
            const bytes = new Uint8Array(buffer);
            // 检测是否为 gzip 格式（某些浏览器会自动解压 Content-Encoding: gzip）
            let text;
            if (bytes.length >= 2 && bytes[0] === 0x1f && bytes[1] === 0x8b) {
                // 原始 gzip，手动解压
                text = pako.inflate(bytes, { to: 'string' });
            } else {
                // 浏览器已自动解压（移动端 Safari 等）
                text = new TextDecoder().decode(bytes);
            }
            return JSON.parse(text);
        }

        function renderProductTabs() {
            const products = ['all', 'vacuum', 'scrubber', 'cleaner', 'dryer', 'pool'];
            const container = document.getElementById('product-tabs');
            container.innerHTML = products.map(p => {
                const label = productLabels[currentLang][p];
                const count = p === 'all' ? allData.length : allData.filter(i => {
                    const productName = getProductName(i.product, 'cn');
                    return productName === productLabels.cn[p];
                }).length;
                return `<button class="product-tab ${p === currentProduct ? 'active' : ''}" data-product="${p}">${label} (${count})</button>`;
            }).join('');

            container.querySelectorAll('.product-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    currentProduct = tab.dataset.product;
                    currentPage = 1;
                    renderContent();
                    renderProductTabs();
                });
            });
        }

        function filterData() {
            return allData.filter(item => {
                // 产品筛选
                if (currentProduct !== 'all') {
                    const productName = getProductName(item.product, 'cn');
                    if (productName !== productLabels.cn[currentProduct]) return false;
                }

                // 搜索筛选
                if (searchQuery) {
                    const q = getQuestion(item, currentLang).toLowerCase();
                    const a = getAnswer(item, currentLang).toLowerCase();
                    const query = searchQuery.toLowerCase();
                    return q.includes(query) || a.includes(query);
                }

                return true;
            });
        }

        function renderContent() {
            const filtered = filterData();
            const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const pageData = filtered.slice(start, start + ITEMS_PER_PAGE);

            document.getElementById('stats').textContent = 
                `显示 ${start + 1}-${Math.min(start + ITEMS_PER_PAGE, filtered.length)} / 共 ${filtered.length} 条`;

            const container = document.getElementById('content');
            container.innerHTML = pageData.map(item => {
                const productName = getProductName(item.product, currentLang);
                const productColor = productColors[productName] || '';
                const q = getQuestion(item, currentLang);
                const a = getAnswer(item, currentLang);
                const showNote = needsTranslationNote(item, currentLang);

                return `
                    <div class="faq-card" onclick="this.classList.toggle('expanded')">
                        <div class="faq-header">
                            <div class="faq-badge">
                                <span class="product-tag ${productColor}">${productName}</span>
                                ${item.model ? `<span class="product-model">${item.model}</span>` : ''}
                            </div>
                            <div class="faq-content">
                                <div class="faq-question">
                                    <span class="faq-icon">Q</span>
                                    <span>${q.replace(/\n/g, '<br>')}</span>
                                    <span class="faq-toggle">▼</span>
                                </div>
                            </div>
                        </div>
                        <div class="faq-answer">
                            <div class="faq-answer-inner">
                                <div style="display:flex;align-items:flex-start;gap:0.5rem;margin-bottom:0.5rem;">
                                    <span class="faq-icon faq-icon-a">A</span>
                                    <span>${a.replace(/\n/g, '<br>')}</span>
                                </div>
                                ${showNote ? `<div class="translation-note">（暂无${currentLang === 'en' ? '英文' : currentLang === 'jp' ? '日文' : '韩文'}翻译，显示中文答案）</div>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            if (totalPages <= 1) return;

            const container = document.getElementById('content');
            const pagination = document.createElement('div');
            pagination.className = 'pagination';

            let buttons = [];
            if (currentPage > 1) buttons.push(`<button class="page-btn" onclick="changePage(${currentPage - 1})">上一页</button>`);

            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    buttons.push(`<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`);
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    buttons.push(`<span>...</span>`);
                }
            }

            if (currentPage < totalPages) buttons.push(`<button class="page-btn" onclick="changePage(${currentPage + 1})">下一页</button>`);

            pagination.innerHTML = buttons.join('');
            container.appendChild(pagination);
        }

        function changePage(page) {
            currentPage = page;
            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 语言切换
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentLang = btn.dataset.lang;
                renderProductTabs();
                renderContent();
            });
        });

        // 搜索
        document.getElementById('search-box').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            currentPage = 1;
            renderContent();
        });

        init();
    </script>
</body>
</html>
