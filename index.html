<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreame FAQ</title>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <style>
        :root { --primary: #dc2626; --gray-50: #f9fafb; --gray-200: #e5e7eb; --gray-500: #6b7280; --gray-700: #374151; --gray-900: #111827; --radius: 8px; --shadow: 0 1px 3px 0 rgba(0,0,0,0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: var(--gray-50); color: var(--gray-900); line-height: 1.6; }
        .header { background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); color: white; padding: 2rem 1rem; text-align: center; }
        .header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .container { max-width: 900px; margin: 0 auto; padding: 1rem; }
        .controls { background: white; border-radius: var(--radius); padding: 1rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
        .lang-selector { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .lang-btn { padding: 0.5rem 1rem; border: 1px solid var(--gray-200); background: white; border-radius: var(--radius); cursor: pointer; font-size: 0.875rem; }
        .lang-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .search-box { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--gray-200); border-radius: var(--radius); font-size: 0.95rem; }
        .product-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .product-tab { padding: 0.5rem 0.875rem; border: 1px solid var(--gray-200); background: white; border-radius: 20px; cursor: pointer; font-size: 0.8rem; }
        .product-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
        .stats { background: white; padding: 0.75rem 1rem; border-radius: var(--radius); margin-bottom: 1rem; font-size: 0.875rem; color: var(--gray-500); }
        .faq-card { background: white; border-radius: var(--radius); margin-bottom: 0.75rem; box-shadow: var(--shadow); overflow: hidden; cursor: pointer; }
        .faq-header { padding: 1rem; display: flex; align-items: flex-start; gap: 0.75rem; }
        .faq-badge { display: flex; flex-direction: column; gap: 0.25rem; min-width: 100px; }
        .product-tag { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-align: center; background: #e5e7eb; color: #374151; }
        .product-tag.vacuum { background: #dbeafe; color: #1d4ed8; }
        .product-tag.scrubber { background: #dcfce7; color: #15803d; }
        .product-tag.cleaner { background: #fef3c7; color: #b45309; }
        .product-tag.dryer { background: #fce7f3; color: #be185d; }
        .product-tag.pool { background: #e0f2fe; color: #0369a1; }
        .product-model { font-size: 0.7rem; color: var(--gray-500); text-align: center; }
        .faq-content { flex: 1; }
        .faq-question { font-weight: 600; color: var(--gray-900); display: flex; align-items: flex-start; gap: 0.5rem; }
        .faq-icon { background: var(--primary); color: white; width: 20px; height: 20px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; }
        .faq-icon-a { background: #16a34a; }
        .faq-toggle { color: var(--gray-500); font-size: 0.75rem; transition: transform 0.2s; }
        .faq-card.expanded .faq-toggle { transform: rotate(180deg); }
        .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: var(--gray-50); }
        .faq-card.expanded .faq-answer { max-height: 2000px; }
        .faq-answer-inner { padding: 1rem; padding-left: calc(100px + 1.75rem); color: var(--gray-700); font-size: 0.95rem; }
        .loading { text-align: center; padding: 3rem; color: var(--gray-500); }
        .translation-note { font-size: 0.75rem; color: var(--gray-500); font-style: italic; margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px dashed var(--gray-200); }
        .pagination { display: flex; justify-content: center; gap: 0.25rem; margin-top: 1.5rem; flex-wrap: wrap; }
        .page-btn { padding: 0.5rem 0.75rem; border: 1px solid var(--gray-200); background: white; border-radius: var(--radius); cursor: pointer; }
        .page-btn.active { background: var(--primary); color: white; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        @media (max-width: 600px) { .faq-header { flex-direction: column; } .faq-badge { flex-direction: row; min-width: auto; } .faq-answer-inner { padding-left: 1rem; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 Dreame FAQ 智能问答</h1>
        <p>全球多语言售后知识库 · <span id="total-count">加载中...</span></p>
    </div>
    <div class="container">
        <div class="controls">
            <div class="lang-selector">
                <button class="lang-btn active" data-lang="cn">中文</button>
                <button class="lang-btn" data-lang="en">English</button>
                <button class="lang-btn" data-lang="jp">日本語</button>
                <button class="lang-btn" data-lang="kr">한국어</button>
            </div>
            <input type="text" class="search-box" id="search-box" placeholder="搜索问题或答案...">
        </div>
        <div class="product-tabs" id="product-tabs"></div>
        <div class="stats" id="stats"></div>
        <div id="content"><div class="loading">📦 正在加载 FAQ 数据...</div></div>
    </div>

    <script>
        const CONFIG_URL = 'config.json';
        const CHUNK_PREFIX = 'faq_chunk_';
        const ITEMS_PER_PAGE = 30;

        let allData = [];
        let currentLang = 'cn';
        let currentProduct = 'all';
        let currentPage = 1;
        let searchQuery = '';

        const productLabels = {
            cn: { all: '全部', vacuum: '扫地机', scrubber: '洗地机', cleaner: '吸尘器', dryer: '吹风机', pool: '泳池机器人' },
            en: { all: 'All', vacuum: 'Robot Vacuum', scrubber: 'Floor Scrubber', cleaner: 'Vacuum Cleaner', dryer: 'Hair Dryer', pool: 'Pool Robot' },
            jp: { all: 'すべて', vacuum: 'ロボット掃除機', scrubber: '床洗浄機', cleaner: '掃除機', dryer: 'ヘアドライヤー', pool: 'プールロボット' },
            kr: { all: '전체', vacuum: '로봇청소기', scrubber: '바닥세정기', cleaner: '진공청소기', dryer: '헤어드라이어', pool: '수영장로봇' }
        };

        const productColors = {
            '扫地机': 'vacuum', 'Robot Vacuum': 'vacuum', 'ロボット掃除機': 'vacuum', '로봇청소기': 'vacuum',
            '洗地机': 'scrubber', 'Floor Scrubber': 'scrubber', '床洗浄機': 'scrubber', '바닥세정기': 'scrubber',
            '吸尘器': 'cleaner', 'Vacuum Cleaner': 'cleaner', '掃除機': 'cleaner', '진공청소기': 'cleaner',
            '吹风机': 'dryer', 'Hair Dryer': 'dryer', 'ヘアドライヤー': 'dryer', '헤어드라이어': 'dryer',
            '泳池机器人': 'pool', 'Pool Robot': 'pool', 'プールロボット': 'pool', '수영장로봇': 'pool'
        };

        // 获取产品名称（兼容字符串和对象格式）
        function getProductName(item, lang) {
            const p = item.product;
            if (typeof p === 'string') {
                const map = {
                    'cn': { '扫地机': '扫地机', '洗地机': '洗地机', '吸尘器': '吸尘器', '吹风机': '吹风机', '泳池机器人': '泳池机器人' },
                    'en': { '扫地机': 'Robot Vacuum', '洗地机': 'Floor Scrubber', '吸尘器': 'Vacuum Cleaner', '吹风机': 'Hair Dryer', '泳池机器人': 'Pool Robot' },
                    'jp': { '扫地机': 'ロボット掃除機', '洗地机': '床洗浄機', '吸尘器': '掃除機', '吹风机': 'ヘアドライヤー', '泳池机器人': 'プールロボット' },
                    'kr': { '扫地机': '로봇청소기', '洗地机': '바닥세정기', '吸尘器': '진공청소기', '吹风机': '헤어드라이어', '泳池机器人': '수영장로봇' }
                };
                return (map[lang] && map[lang][p]) ? map[lang][p] : p;
            }
            if (p && typeof p === 'object') return p[lang] || p.cn || p.en || 'Others';
            return 'Others';
        }

        // 获取问题文本（兼容字符串和对象格式）
        function getQuestion(item, lang) {
            const q = item.question;
            if (typeof q === 'string') return q;
            if (q && typeof q === 'object') return q[lang] || q.cn || q.en || '';
            return '';
        }

        // 获取答案文本（兼容字符串和对象格式）
        // 修复：当其他语言答案和问题时，自动回退到中文答案
        function getAnswer(item, lang) {
            const a = item.answer || item.solution;
            if (typeof a === 'string') return a;
            if (a && typeof a === 'object') {
                const answer = a[lang];
                const question = getQuestion(item, lang);
                // 如果当前语言的答案和问题时，说明翻译不完整，回退到中文
                if (lang !== 'cn' && answer && question && answer.trim() === question.trim()) {
                    return a.cn || '';
                }
                return answer || a.cn || a.en || '';
            }
            return '';
        }

        // 检查是否需要显示翻译提示
        function needsTranslationNote(item, lang) {
            if (lang === 'cn') return false;
            const a = item.answer || item.solution;
            if (!a || typeof a !== 'object') return false;
            const answer = a[lang];
            const question = getQuestion(item, lang);
            // 如果答案和问题时，或者当前语言没有答案
            return !answer || (answer && question && answer.trim() === question.trim());
        }

        async function init() {
            try {
                await loadAllData();
                renderProductTabs();
                renderContent();
                document.getElementById('total-count').textContent = allData.length + ' 条 FAQ';
            } catch (error) {
                console.error(error);
                document.getElementById('content').innerHTML = '<div class="loading">加载失败: ' + error.message + '</div>';
            }
        }

        async function loadAllData() {
            const config = await fetch(CONFIG_URL).then(r => r.json());
            const totalChunks = config.totalChunks;
            allData = [];
            
            for (let i = 0; i < totalChunks; i++) {
                try {
                    const chunk = await loadChunk(i);
                    const faqs = Array.isArray(chunk) ? chunk : (chunk.faqs || []);
                    allData = allData.concat(faqs);
                    console.log('Chunk', i, 'loaded:', faqs.length, 'FAQs');
                } catch (err) {
                    console.error('Chunk', i, 'error:', err);
                }
            }
            console.log('Total loaded:', allData.length, 'FAQs');
        }

        async function loadChunk(index) {
            const response = await fetch(CHUNK_PREFIX + index + '.json.gz');
            const compressed = await response.arrayBuffer();
            const decompressed = pako.inflate(new Uint8Array(compressed), { to: 'string' });
            return JSON.parse(decompressed);
        }

        function setLang(lang) {
            currentLang = lang;
            currentPage = 1;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            renderProductTabs();
            renderContent();
        }

        function setProduct(product) {
            currentProduct = product;
            currentPage = 1;
            renderProductTabs();
            renderContent();
        }

        function handleSearch(value) {
            searchQuery = value.toLowerCase().trim();
            currentPage = 1;
            renderContent();
        }

        function renderProductTabs() {
            const counts = getProductCounts();
            const labels = productLabels[currentLang];
            const container = document.getElementById('product-tabs');
            container.innerHTML = Object.entries(labels).map(([key, label]) => {
                const count = counts[key] || 0;
                const active = currentProduct === key ? 'active' : '';
                return '<button class="product-tab ' + active + '" onclick="setProduct(\'' + key + '\')">' + label + ' (' + count + ')</button>';
            }).join('');
        }

        function getProductCounts() {
            const counts = { all: allData.length };
            allData.forEach(item => {
                const productName = getProductName(item, 'cn');
                if (productName.includes('扫地')) counts.vacuum = (counts.vacuum || 0) + 1;
                else if (productName.includes('洗地')) counts.scrubber = (counts.scrubber || 0) + 1;
                else if (productName.includes('吸尘')) counts.cleaner = (counts.cleaner || 0) + 1;
                else if (productName.includes('吹风')) counts.dryer = (counts.dryer || 0) + 1;
                else if (productName.includes('泳池')) counts.pool = (counts.pool || 0) + 1;
            });
            return counts;
        }

        function getFilteredData() {
            return allData.filter(item => {
                if (currentProduct !== 'all') {
                    const productName = getProductName(item, 'cn');
                    const map = { vacuum: '扫地', scrubber: '洗地', cleaner: '吸尘', dryer: '吹风', pool: '泳池' };
                    if (!productName.includes(map[currentProduct])) return false;
                }
                if (searchQuery) {
                    const qAll = [getQuestion(item, 'cn'), getQuestion(item, 'en'), getQuestion(item, 'jp'), getQuestion(item, 'kr')].join(' ').toLowerCase();
                    const aAll = [getAnswer(item, 'cn'), getAnswer(item, 'en'), getAnswer(item, 'jp'), getAnswer(item, 'kr')].join(' ').toLowerCase();
                    return (qAll + ' ' + aAll).includes(searchQuery);
                }
                return true;
            });
        }

        function renderContent() {
            const filtered = getFilteredData();
            const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const pageData = filtered.slice(start, start + ITEMS_PER_PAGE);

            document.getElementById('stats').textContent = '共 ' + filtered.length + ' 条 · 第 ' + currentPage + '/' + totalPages + ' 页';

            let html = '<div>';
            pageData.forEach(item => {
                html += renderFAQCard(item);
            });
            html += '</div>';

            if (totalPages > 1) {
                html += '<div class="pagination">';
                html += '<button class="page-btn" onclick="changePage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>←</button>';
                for (let i = 1; i <= totalPages; i++) {
                    if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                        html += '<button class="page-btn ' + (i === currentPage ? 'active' : '') + '" onclick="changePage(' + i + ')">' + i + '</button>';
                    }
                }
                html += '<button class="page-btn" onclick="changePage(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>→</button>';
                html += '</div>';
            }

            const container = document.getElementById('content');
            container.innerHTML = html;

            container.querySelectorAll('.faq-card').forEach(card => {
                card.onclick = function(e) {
                    if (e.target.closest('a')) return;
                    this.classList.toggle('expanded');
                };
            });
        }

        function renderFAQCard(item) {
            const productName = getProductName(item, currentLang);
            const productCn = getProductName(item, 'cn');
            const productModel = item.product_model || '';
            const question = getQuestion(item, currentLang);
            const answer = getAnswer(item, currentLang);
            const colorClass = productColors[productCn] || productColors[productName] || '';
            
            // 检查是否需要显示翻译提示
            const showNote = needsTranslationNote(item, currentLang);
            const translationNote = showNote ? 
                '<div class="translation-note">（此内容暂无' + getLangName(currentLang) + '翻译，显示中文原文）</div>' : '';

            return '<div class="faq-card"><div class="faq-header"><div class="faq-badge"><span class="product-tag ' + colorClass + '">' + escapeHtml(productName) + '</span>' + (productModel ? '<span class="product-model">' + escapeHtml(productModel) + '</span>' : '') + '</div><div class="faq-content"><div class="faq-question"><span class="faq-icon">Q</span><span>' + escapeHtml(question) + '</span></div></div><span class="faq-toggle">▼</span></div><div class="faq-answer"><div class="faq-answer-inner"><span class="faq-icon faq-icon-a">A</span>' + formatAnswer(answer) + translationNote + '</div></div></div>';
        }
        
        function getLangName(lang) {
            const names = { cn: '中文', en: '英文', jp: '日文', kr: '韩文' };
            return names[lang] || lang;
        }

        function formatAnswer(text) {
            if (!text) return '<span style="color: var(--gray-500);">（暂无答案）</span>';
            return escapeHtml(text).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>').replace(/\n/g, '<br>');
        }

        function changePage(page) {
            currentPage = page;
            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.onclick = function() { setLang(this.dataset.lang); };
            });
            document.getElementById('search-box').oninput = function() { handleSearch(this.value); };
            init();
        });
    </script>
</body>
</html>
